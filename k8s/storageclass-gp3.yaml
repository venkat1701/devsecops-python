# EKS bootstrap: since Kubernetes 1.30 EKS ships no default StorageClass, so the Postgres PVC would stay Pending.
# Requires the aws-ebs-csi-driver add-on (installed by terraform/main.tf).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
