name: TaskBoard CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "demo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: "0.75.0"
  # Pushes (and therefore deploys) only happen for commits on main, never for pull requests.
  IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # ==========================================================================
  # STAGE 1 — Quality gate: backend tests + frontend build
  # ==========================================================================
  test:
    name: Test (pytest) & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (fails the pipeline on any test failure)
        working-directory: backend
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ==========================================================================
  # STAGE 2 — Build image -> Trivy scan (gate) -> push to GHCR, per component
  # ==========================================================================
  image:
    name: Image ${{ matrix.component }} (build, scan, push)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/taskboard-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan — fail on fixable HIGH/CRITICAL CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/out" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format table --output /out/trivy-${{ matrix.component }}.txt \
              "${IMAGE}:${{ github.sha }}" \
            || { cat trivy-${{ matrix.component }}.txt; exit 1; }
          cat trivy-${{ matrix.component }}.txt
          cat trivy-${{ matrix.component }}.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.txt
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: env.IS_RELEASE == 'true'
        run: docker push "${IMAGE}:${{ github.sha }}"

  # ==========================================================================
  # STAGE 3 — Deploy the Helm chart to an ephemeral kind cluster and smoke-test it
  # ==========================================================================
  deploy-test:
    name: Helm deploy & smoke test (kind)
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Install chart with images pulled from GHCR
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n taskboard create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          helm upgrade --install taskboard ./helm/taskboard -n taskboard \
            --set "backend.image=ghcr.io/$owner/taskboard-backend" --set backend.tag=${{ github.sha }} \
            --set "frontend.image=ghcr.io/$owner/taskboard-frontend" --set frontend.tag=${{ github.sha }} \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --set ingress.enabled=false --set hpa.enabled=false \
            --wait --timeout 5m

      - name: Show cluster state
        if: always()
        run: |
          kubectl get pods,svc,deploy -n taskboard -o wide
          kubectl get events -n taskboard --sort-by=.lastTimestamp | tail -30

      - name: End-to-end smoke test through the frontend Service
        run: |
          kubectl -n taskboard port-forward svc/taskboard-taskboard-frontend 3000:80 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          ./scripts/smoke-test.sh http://localhost:3000
          kubectl -n taskboard port-forward svc/taskboard-taskboard-backend 8000:8000 &
          sleep 3
          curl -sf http://localhost:8000/metrics | grep -E '^http_requests_total' | head -5

  # ==========================================================================
  # STAGE 4 — GitOps: record the new image tag; Argo CD syncs it to EKS
  # ==========================================================================
  gitops:
    name: Bump image tag for Argo CD
    needs: deploy-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Update helm/taskboard/values-prod.yaml and push
        run: |
          sed -i -E "s/^(\s+tag: ).*/\1\"${GITHUB_SHA}\"/" helm/taskboard/values-prod.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): deploy ${GITHUB_SHA::7} to prod [skip ci]" || { echo "nothing to change"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
