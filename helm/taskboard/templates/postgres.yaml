apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
  labels: {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username .Values.postgres.password (include "taskboard.postgresHost" .) .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.postgresHost" . }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector: {{- include "taskboard.selector" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres-data
  labels: {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # don't lose the database on `helm uninstall`
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # ReadWriteOnce volume: the old pod must release it before the new one starts
  selector:
    matchLabels: {{- include "taskboard.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: {{ include "taskboard.fullname" . }}-postgres, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ include "taskboard.fullname" . }}-postgres, key: password}}}
            # Block volumes (EBS) contain lost+found at the mount root, which initdb refuses; use a subdirectory.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "taskboard.fullname" . }}-postgres-data}
