apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {{- include "taskboard.selector" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
