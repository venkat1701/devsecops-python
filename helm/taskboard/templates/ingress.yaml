{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # /api/* -> FastAPI (paths are passed through unchanged, the API already lives under /api)
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "taskboard.fullname" . }}-backend, port: {name: http}}}
          # everything else -> React SPA served by Nginx
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "taskboard.fullname" . }}-frontend, port: {name: http}}}
{{- end }}
